[package]
name = "state-m"
version = "0.4.4"
edition = "2024"
description = "The library implements convenient state distribution and management mechanisms, facilitating collaborative work between components."
repository = "https://github.com/xiongxiong/state-m"
authors = ["WonderBear<ximengwuheng@163.com>"]
keywords = ["state", "machine", "subscribe"]
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
crossfire = "3.1"
dashmap = "6.2"
derivative = "2.2"
inventory = "0.3"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt"] }
tracing = "0.1"

[dev-dependencies]

[features]
default = []

[[test]]
name = "test"
path = "tests/test.rs"
